name: CRAN dependency check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cran-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: false
      - name: Check CRAN versions without development overrides
        run: Rscript scripts/check_cran_dependencies.R
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
