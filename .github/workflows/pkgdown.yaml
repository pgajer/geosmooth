name: Package website

on:
  push:
    branches: [main]
    paths-ignore:
      - 'validation/**'
      - 'dev/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: package-website
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            github::pgajer/ivue@a952ab6816636a19f2038ba0709181608b71770d
            github::pgajer/dgraphs@e7cde950dd86a411f1d41e707392789d33f5617c
            github::pgajer/grip@07dc145c89ff31b399a7e4c0b8e1b86f391fc08b
      - name: Build site and both reference indexes
        run: Rscript scripts/build_website.R
      - name: Check internal links and export coverage
        run: python3 scripts/check_website.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
